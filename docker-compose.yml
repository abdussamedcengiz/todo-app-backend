# YEREL TEST VERITABANI
#
# Testler gercek bir PostgreSQL ister (mock degil, gercek sorgular).
# CI bunu kendisi ayaga kaldiriyordu ama YERELDE testleri calistirmanin
# belgelenmis bir yolu yoktu -- "npm test" calistiran biri once elle
# Postgres kurmak zorundaydi.
#
# Kullanim:
#   npm run db:up      -> veritabanini baslat
#   npx prisma migrate deploy
#   npm test
#   npm run db:down    -> durdur ve verileri sil
#
# Port 5434 kasitli: makinede zaten calisan bir PostgreSQL varsa
# (varsayilan 5432) ya da baska bir konteyner ile catismasin.
services:
  db:
    image: postgres:16-alpine
    container_name: todo-app-test-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
