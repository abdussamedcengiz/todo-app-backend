name: Testler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # alpine: ayni PostgreSQL, belirgin sekilde kucuk imaj ->
        # kosu basina daha kisa indirme suresi.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # DIKKAT: en az 32 karakter olmali (config/env.ts bunu denetler).
      # Bu bir SIR DEGIL -- yalnizca CI'da uretilip atilan token'lari
      # imzalar ve hicbir gercek veriye erisim vermez. Gercek anahtar
      # Render panelinde durur.
      JWT_SECRET: ci-icin-test-anahtari-en-az-32-karakter-uzunlugunda

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # Tip kontrolu testlerden ONCE: derlenmeyen bir kodun
      # testlerini calistirmanin anlami yok, ve hata mesaji
      # burada cok daha anlasilir olur.
      #
      # Onceden tsconfig yalnizca server.ts'i kapsadigi icin
      # testler ve cogu dosya tip kontrolunun disindaydi.
      - run: npm run typecheck

      # "npm test" artik "vitest run" (izleme modu degil), bu yuzden
      # "-- --run" eki gereksiz.
      - run: npm test
